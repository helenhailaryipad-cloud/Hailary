<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Moonwater Fishing</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#102344;color:#fff4d6;font:17px Georgia,serif}main{position:relative;isolation:isolate;margin:auto;max-width:1050px;min-height:100svh;overflow:hidden;background:linear-gradient(180deg,#162456ad,#25387260 42%,#067487 58%,#084558 78%,#142b40),url(assets/sunny-garden.webp) center 30%/cover}header,footer{position:relative;z-index:2;padding:clamp(16px,4vw,34px)}header{display:flex;justify-content:space-between;align-items:start;gap:12px;text-shadow:0 2px 5px #091833}h1{margin:0;font-size:clamp(24px,6vw,46px)}button{font:700 17px Georgia;color:#342113;border:1px solid #ffe7ac;background:linear-gradient(#ffdf95,#dca651);border-radius:12px;padding:11px 18px;min-height:44px;touch-action:manipulation;cursor:pointer}button:disabled{opacity:.55}.water{position:absolute;top:50%;bottom:0;width:100%;background:repeating-radial-gradient(ellipse at 50% 0%,transparent 0 27px,#a2f6e921 30px,transparent 32px 62px);pointer-events:none}.float{position:absolute;left:55%;top:53%;width:12px;height:22px;border-radius:60%;background:linear-gradient(#fff4b8 48%,#ed684b 50%);box-shadow:0 3px 12px #c6fff8;animation:bob 2s ease-in-out infinite}.float:after{content:'';position:absolute;left:-16px;top:16px;width:43px;height:8px;border:1px solid #c7f4e9;border-radius:50%}@keyframes bob{50%{transform:translateY(4px)}}footer{position:absolute;bottom:0;width:100%;text-align:center;background:linear-gradient(transparent,#081d34ed 36%)}.meter{position:relative;margin:15px auto;width:min(300px,82%);height:14px;border-radius:9px;background:#17283a;border:1px solid #ecc789}.zone{position:absolute;width:30%;height:100%;background:#63dea1;border-radius:8px}.needle{position:absolute;top:-6px;width:5px;height:24px;background:#fff3ca;box-shadow:0 0 7px #ffe695;border-radius:4px}.controls{display:flex;justify-content:center;align-items:center;gap:14px}.controls button{min-width:54px}.status{margin:0;min-height:2.4em;text-shadow:0 2px 4px #071323}progress{accent-color:#70deb4;width:min(160px,45%);height:8px}dialog{max-width:85%;width:320px;max-height:72svh;overflow:auto;color:#fff2cc;background:#14394b;border:1px solid #dbc18a;border-radius:15px;padding:22px;text-align:center}dialog::backdrop{background:#08132463}dialog h2{margin:0 0 12px}svg{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}button:focus-visible{outline:3px solid white}
#cup{position:relative;z-index:1;margin:0 clamp(16px,4vw,34px);width:fit-content;max-width:85%;background:#102e47ed;border:1px solid #ae9868;border-radius:10px;padding:9px 12px;font:15px Georgia}#cup summary{cursor:pointer}#cup ol{padding-left:23px;margin:8px 0 0}#cup li{padding:2px}#cup .self{color:#ffe49d}@media(max-height:450px){#cup{max-height:22vh;overflow:auto}}
footer{padding:10px max(12px,env(safe-area-inset-right)) max(8px,env(safe-area-inset-bottom));background:linear-gradient(transparent,#102d3cee 16%);display:grid;justify-items:center;gap:6px}
footer .status{min-height:0;font-size:clamp(15px,2.1vw,20px);line-height:1.2;margin:4px 0}
.meter{width:min(88%,510px);height:38px;margin:5px auto;border:2px solid #e3c78c;background:linear-gradient(#163749,#235665);box-shadow:inset 0 2px 5px #0c2436;border-radius:24px;touch-action:none}
.zone{background:linear-gradient(90deg,#268a70,#71e2ac 50%,#268a70);border-inline:2px solid #b6ffd2;border-radius:20px}
.needle{width:23px;height:23px;top:50%;transform:translate(-50%,-50%);border-radius:50%;border:2px solid #ffe4a5;background:radial-gradient(circle at 36% 28%,white,#fff4d8 36%,#d9aa5a 75%);box-shadow:0 1px 5px #203a38;pointer-events:none}
footer{
 -webkit-user-select:none;user-select:none;-webkit-touch-callout:none
}
.controls{display:flex;width:min(94%,480px);margin:0 auto;justify-content:center;gap:clamp(12px,3vw,24px)}
.controls button{
 display:inline-flex;align-items:center;justify-content:center;gap:12px;min-width:0;
 min-height:clamp(58px,7vw,72px);padding:8px 18px;touch-action:none;
 border:2px solid #efcb88;border-radius:18px;font:700 clamp(19px,3vw,25px)/1.12 Georgia,serif;
 box-shadow:inset 0 1px #ffe7b9,0 3px 0 #463626,0 4px 12px #09374799
}
.controls :is(#left,#right,#hold){flex:1;color:#fff6d6;background:linear-gradient(#2c7869,#174a44)}
.controls :is(#left,#right)::before{
 content:"";width:.55em;height:.55em;flex:none;border:solid #fff2c1;border-width:0 4px 4px 0;
 transform:rotate(135deg)
}
.controls #right::before{order:1;transform:rotate(-45deg)}
.controls #cast{min-width:min(220px,90%)}
.controls button:active:not(:disabled){transform:translateY(2px);box-shadow:inset 0 2px 5px #15392e77}
.controls button[hidden],.controls:not(:has(button:not([hidden]))){display:none}
.controls button:disabled{opacity:.85}
.mode-choice,.catch-progress{font-size:15px;display:flex;align-items:center;gap:8px}
.catch-progress progress{width:clamp(100px,20vw,160px)}
.mode-choice select{background:#1f484d;color:#fff1cd;font:inherit;border:1px solid #ceb47d;border-radius:8px;padding:4px 10px;min-height:44px}
body:not([data-phase=idle]) .mode-choice,body:not([data-phase=reel]) .catch-progress{display:none}
body[data-mode=drag] .meter{cursor:ew-resize;height:54px}
.needle{width:29px;height:29px}
@media(max-height:440px){header{padding:8px 14px}h1{font-size:22px}footer{gap:3px}.meter{margin:2px auto}.controls button{min-height:50px}.mode-choice select{min-height:40px}}
.fishing-settings{display:flex;align-items:center;justify-content:center;flex-wrap:wrap;gap:6px 14px}
body:not([data-phase=idle]) .fishing-settings{display:none}
#viewDesigns,.gallery-bar button{font-size:15px;background:#214b49;color:#fff0cc;padding:5px 12px}
#designGallery{width:min(760px,96vw);max-width:96vw;max-height:95dvh;margin:auto;padding:12px;box-sizing:border-box;background:#193c43}
.gallery-bar{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:8px}
.gallery-bar h2{font-size:clamp(16px,3vw,24px);margin:0;text-align:left}
.gallery-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.gallery-grid button{display:grid;gap:3px;padding:2px 2px 5px;min-width:0;overflow:hidden;background:#25514b;color:#fff1cd;font-size:clamp(13px,2.2vw,17px);border-radius:8px}
.gallery-grid img{width:100%;height:min(27dvh,230px);object-fit:contain;display:block;background:#10323a}
#designDetail{display:block;width:100%;max-height:calc(90dvh - 72px);object-fit:contain}
#designGallery [hidden]{display:none}
</style><main><header><div><h1>Moonwater Fishing</h1><span id="best"></span></div><button id="basket">Fish basket</button></header><details id="cup"><summary id="cupTitle"></summary><ol id="ranks"></ol><p id="cupPrize">First prize · Moonwater Pearl</p></details><div class="water"></div><svg viewBox="0 0 100 100" preserveAspectRatio="none" aria-hidden="true"><path d="M8 74 Q20 49 34 36" fill="none" stroke="#d9b36c" stroke-width=".62"/><path d="M34 36 Q42 45 55.6 54" fill="none" stroke="#fff4cd" stroke-width=".14"/></svg><div class="float"></div><footer><p class="status" id="status" role="status">Cast your line into the lagoon.</p><div class="meter" id="rail"><span class="zone"></span><i class="needle"></i></div>
<div class="controls">
 <button id="left" aria-label="Pull left">Left</button><button id="cast">Cast line</button><button id="right" aria-label="Pull right">Right</button>
 <button id="hold" hidden>Hold to reel right</button>
</div>
<label class="catch-progress">Catch <progress id="fill" max="1" value="0"></progress></label>
<div class="fishing-settings"><label class="mode-choice">Controls <select id="controlMode"><option value="arrows">Twin arrows</option><option value="drag">Pearl slider</option><option value="hold">Hold &amp; release</option></select></label><button id="viewDesigns" type="button">View 4 designs</button></div></footer></main><dialog><h2 id="title"></h2><p id="message"></p><button id="close">Continue</button></dialog>
<dialog id="designGallery" aria-labelledby="designTitle">
 <div class="gallery-bar"><button id="allDesigns" type="button" hidden>‹ All designs</button><h2 id="designTitle">Fishing designs</h2><button id="doneDesigns" type="button">Done</button></div>
 <div class="gallery-grid" id="designGrid"></div><img id="designDetail" hidden alt="">
</dialog><script>
const el=id=>document.getElementById(id),dialog=document.querySelector('dialog');
const designs=[['А','Pearl track','pearl'],['Б','Moon compass','compass'],['В','Feather float','float'],['Г','Golden reel','reel']];
const gallery=el('designGallery'),designGrid=el('designGrid'),detailImage=el('designDetail');
let selectedDesignButton;
function showDesignGrid(){
 designGrid.hidden=false;detailImage.hidden=true;el('allDesigns').hidden=true;
 el('designTitle').textContent='Fishing designs';
}
el('viewDesigns').onclick=()=>{
 if(!designGrid.children.length){
  for(const [letter,name,file] of designs){
   const button=document.createElement('button'),img=document.createElement('img');
   img.src='assets/generated/fishing-design-'+file+'.webp';img.alt='';
   button.type='button';button.append(img,letter+' · '+name);
   button.onclick=()=>{
    selectedDesignButton=button;detailImage.src=img.src;detailImage.alt=name;detailImage.hidden=false;
    el('designTitle').textContent=letter+' · '+name;designGrid.hidden=true;el('allDesigns').hidden=false;el('allDesigns').focus();
   };
   designGrid.append(button);
  }
 }
 showDesignGrid();gallery.showModal();
};
el('allDesigns').onclick=()=>{showDesignGrid();selectedDesignButton?.focus()};
el('doneDesigns').onclick=()=>gallery.close();
const fish=[['Silver Minnow',.2,1.6],['Moonfin Trout',1.3,8],['Jade Carp',3,16],['Star Sailfish',14,75]];
const key='wonder-fishing-records-v1';let records={};
try{records=JSON.parse(localStorage.getItem(key))||{}}catch{}
const lisbonClock=new Intl.DateTimeFormat('en-GB',{timeZone:'Europe/Lisbon',year:'numeric',month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit',second:'2-digit',hourCycle:'h23'});
const anglers=['Nyra','Kael','Pip','Vesper'];
const duration=1800;
function eventTime(date=new Date()){
 const t=Object.fromEntries(lisbonClock.formatToParts(date).map(v=>[v.type,v.value]));
 const elapsed=(Number(t.hour)-21)*3600+Number(t.minute)*60+Number(t.second);
 return {day:t.year+'-'+t.month+'-'+t.day,elapsed,live:elapsed>=0&&elapsed<duration};
}
let castDay='',cachedDay='',schedule=[],playerScore=0;
function loadCup(day){
 cachedDay=day;playerScore=0;schedule=[];
 try{playerScore=Number(localStorage.getItem('moonwater-cup-'+day))||0}catch{}
 let state=Number(day.replaceAll('-',''));
 function random(){state=(Math.imul(state,1664525)+1013904223)>>>0;return state/4294967296}
 for(const name of anglers){
  const catches=[];
  for(let at=15+random()*40;at<duration;at+=45+random()*95){
   const [species,lo,hi]=fish[Math.floor(random()**1.7*fish.length)];
   catches.push({at,kg:+(lo+random()*(hi-lo)).toFixed(2),species});
  }
  schedule.push({name,catches});
 }
}
const pearlKey='moonwater-pearl-days';
let pearls=[];
try{const days=JSON.parse(localStorage.getItem(pearlKey));if(Array.isArray(days))pearls=days}catch{}
let checkedFinal='';
function awardPearl(day,kg){
 if(!kg||pearls.includes(day))return;
 const rivalBest=Math.max(...schedule.flatMap(bot=>bot.catches.map(c=>c.kg)));
 if(kg<rivalBest)return;
 pearls.push(day);
 try{localStorage.setItem(pearlKey,JSON.stringify(pearls))}catch{}
}
function settleCup(t){
 const marker=t.day+(t.elapsed>=duration?'closed':'open');
 if(checkedFinal===marker)return;
 checkedFinal=marker;
 try{
  const previous=localStorage.getItem('moonwater-last-entered');
  if(previous&&previous<t.day){
   loadCup(previous);awardPearl(previous,playerScore);loadCup(t.day);
  }
 }catch{}
 if(t.elapsed>=duration)awardPearl(t.day,playerScore);
}
function standings(){
 const t=eventTime();
 if(t.day!==cachedDay)loadCup(t.day);
 settleCup(t);
 el('cupPrize').textContent=pearls.includes(t.day)?'First place! Moonwater Pearl added to your basket.':'First prize · Moonwater Pearl';
 const rows=schedule.map(bot=>({name:bot.name+' · AI',kg:bot.catches.reduce((best,c)=>c.at<=t.elapsed?Math.max(best,c.kg):best,0)}));
 rows.push({name:'You',kg:playerScore});rows.sort((a,b)=>b.kg-a.kg||(a.kg&&a.name==='You'?-1:b.kg&&b.name==='You'?1:0));
 const remaining=duration-t.elapsed;
 el('cupTitle').textContent=t.live?'Fishing Cup · '+Math.floor(remaining/60)+':'+String(remaining%60).padStart(2,'0')+' left':t.elapsed>=duration?'Final standings · Tomorrow at 21:00':'Fishing Cup · Today at 21:00 Lisbon';
 el('ranks').innerHTML=rows.map(row=>'<li class="'+(row.name==='You'?'self':'')+'">'+row.name+' · '+(row.kg?row.kg.toFixed(2)+' kg':'No catch')+'</li>').join('');
 if(t.live&&!standings.wasLive)el('cup').open=true;
 standings.wasLive=t.live;
}
standings();setInterval(standings,1000);
function best(){el('best').textContent='Personal best · '+Math.max(0,...fish.map(([name])=>records[name]?.kg||0)).toFixed(2)+' kg'}
function popup(title,message){el('title').textContent=title;el('message').textContent=message;dialog.showModal()}
let phase='idle',pos=.5,target=.5,progress=0,time=0,last=0,seed=0;
const modeChoice=el('controlMode'),rail=el('rail');
const guidance={
 arrows:'Move the pearl into the green band. Tap or hold an arrow.',
 drag:'Slide the pearl with your finger into the green band.',
 hold:'Hold to move right. Release to drift left. Stay in green.'
};
let held=false,dragPointer=null,arrowPointer=null,arrowDirection=0,repeatAfter=0;
const fishingFooter=document.querySelector('footer');
for(const type of ['selectstart','contextmenu']){
 fishingFooter.addEventListener(type,event=>{if(!event.target.closest('select'))event.preventDefault()});
}
function stopArrow(){arrowPointer=null;arrowDirection=0}

try{const preferred=localStorage.getItem('wonder-fishing-control');if(Object.hasOwn(guidance,preferred))modeChoice.value=preferred}catch{}
function controls(){
 const mode=modeChoice.value;
 document.body.dataset.mode=mode;document.body.dataset.phase=phase;
 el('cast').disabled=phase!=='idle';
 el('cast').hidden=phase==='reel';
 el('left').hidden=el('right').hidden=mode!=='arrows'||phase!=='reel';
 el('left').disabled=el('right').disabled=phase!=='reel';
 el('hold').hidden=mode!=='hold'||phase!=='reel';
 el('basket').disabled=modeChoice.disabled=phase!=='idle';
 if(phase==='idle')el('status').textContent='Cast your line to start fishing.';
}
modeChoice.onchange=()=>{try{localStorage.setItem('wonder-fishing-control',modeChoice.value)}catch{}controls()};
function movePearl(event){
 const bounds=rail.getBoundingClientRect();
 pos=Math.max(.02,Math.min(.98,(event.clientX-bounds.left)/bounds.width));
}
rail.onpointerdown=event=>{
 if(modeChoice.value!=='drag'||phase!=='reel'||dragPointer!==null)return;
 dragPointer=event.pointerId;rail.setPointerCapture(dragPointer);movePearl(event);
};
rail.onpointermove=event=>{if(event.pointerId===dragPointer&&phase==='reel')movePearl(event)};
rail.onlostpointercapture=()=>{dragPointer=null};
el('hold').onpointerdown=event=>{
 if(phase!=='reel')return;
 held=true;event.currentTarget.setPointerCapture(event.pointerId);
};
el('hold').onlostpointercapture=()=>{held=false};
window.addEventListener('blur',()=>{held=false;stopArrow()});
el('hold').onkeydown=event=>{if(['Enter',' '].includes(event.key)){event.preventDefault();held=true}};
el('hold').onkeyup=()=>{held=false};
function finish(won){
 phase='idle';held=false;dragPointer=null;stopArrow();controls();el('cast').textContent='Cast again';
 if(!won){popup('The fish slipped away','Cast again and keep the marker inside the green band.');return}
 const [name,low,high]=fish[Math.floor(Math.random()**1.7*fish.length)];
 const kg=+(low+(high-low)*Math.random()).toFixed(2),old=records[name]||{count:0,kg:0};
 const t=eventTime();
 if(t.live&&t.day===castDay){
  if(cachedDay!==t.day)loadCup(t.day);
  playerScore=Math.max(playerScore,kg);
  try{localStorage.setItem('moonwater-last-entered',t.day);localStorage.setItem('moonwater-cup-'+t.day,String(playerScore))}catch{}
  standings();
 }
 records[name]={count:old.count+1,kg:Math.max(old.kg,kg)};
 try{localStorage.setItem(key,JSON.stringify(records))}catch{}
 best();popup(name,kg.toFixed(2)+' kg · '+(kg>old.kg?'New personal record!':'Species record '+old.kg.toFixed(2)+' kg'));
}
function tick(now){
 if(document.hidden){last=now;requestAnimationFrame(tick);return}
 const dt=Math.min(.06,(now-last)/1000);last=now;time+=dt;
 if(phase==='wait'&&time>1.4){phase='reel';time=0;controls();el('status').textContent=guidance[modeChoice.value];el('cast').textContent='Reeling'}
 if(phase==='reel'){
 target=.5+.22*Math.sin(time*.95);const drift=modeChoice.value==='hold' ? (held ? .42 : -.34) : (dragPointer===null ? .102*Math.sin(time*1.4+seed) : 0);
 pos=Math.max(.02,Math.min(.98,pos+dt*drift));
 if(arrowDirection&&now>=repeatAfter){pull(arrowDirection);repeatAfter=now+150}
 progress=Math.max(0,Math.min(1,progress+(Math.abs(target-pos)<.15?.32:-.11)*dt));
 document.querySelector('.zone').style.left=(target-.15)*100+'%';document.querySelector('.needle').style.left=pos*100+'%';el('fill').value=progress;
 if(progress>=1||time>=15){finish(progress>=1);return}
 }
 requestAnimationFrame(tick)
}
el('cast').onclick=()=>{if(phase!=='idle')return;const t=eventTime();castDay=t.live?t.day:'';phase='wait';time=progress=0;pos=.5;seed=Math.random()*6;document.querySelector('.needle').style.left='50%';document.querySelector('.zone').style.left='35%';last=performance.now();el('fill').value=0;el('status').textContent='Watching the float…';el('cast').textContent='Line cast';controls();requestAnimationFrame(tick)};
function pull(direction){if(phase==='reel')pos=Math.max(.02,Math.min(.98,pos+.073*direction))}
for(const [id,direction] of [['left',-1],['right',1]]){
 const button=el(id);
 button.onpointerdown=event=>{
  if(phase!=='reel'||event.button!==0||arrowPointer!==null)return;
  arrowPointer=event.pointerId;arrowDirection=direction;repeatAfter=performance.now()+320;
  button.setPointerCapture(event.pointerId);pull(direction);
 };
 button.onpointerup=button.onpointercancel=button.onlostpointercapture=event=>{
  if(event.pointerId===arrowPointer)stopArrow();
 };
 button.onclick=event=>{if(event.detail===0)pull(direction)};
}
onkeydown=e=>{if(phase==='reel'&&['ArrowLeft','ArrowRight'].includes(e.key)){e.preventDefault();pull(e.key==='ArrowLeft'?-1:1)}};
el('basket').onclick=()=>popup('Fish basket','Moonwater Pearls: '+pearls.length+' · '+(fish.filter(([name])=>records[name]).map(([name])=>name+' × '+records[name].count+' · '+records[name].kg.toFixed(2)+' kg').join(' / ')||'Your first catch goes here.'));
el('close').onclick=()=>dialog.close();best();controls();document.querySelector('.zone').style.left='35%';document.querySelector('.needle').style.left='50%';
</script></html>
