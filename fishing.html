<script src="fish-catalog.js"></script><script>
const el=id=>document.getElementById(id),dialog=document.querySelector('dialog');
el('exitFishing').onclick=()=>{
 try{if(parent!==window && typeof parent.go==='function'){parent.go('games');return}}catch{}
 location.assign('./?screen=games');
};
const fish=MoonwaterFish.species;
const album=parent.WonderFishAlbum || {
 read:()=>MoonwaterFish.deviceRecords(),
 catch(id,kg){
  const records=this.read(),old=MoonwaterFish.recordCatch(records,id,kg);
  try{localStorage.setItem('moonwater-cards-v1',JSON.stringify(records))}catch{}
  return old;
 },
 open(id){location.href='fish-journal.html?fish='+encodeURIComponent(id)}
};
const lisbonClock=new Intl.DateTimeFormat('en-GB',{timeZone:'Europe/Lisbon',year:'numeric',month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit',second:'2-digit',hourCycle:'h23'});
const anglers=['Nyra','Kael','Pip','Vesper'];
const secondsPerDay=86400;
function eventTime(date=new Date()){
 const t=Object.fromEntries(lisbonClock.formatToParts(date).map(v=>[v.type,v.value]));
 const elapsed=Number(t.hour)*3600+Number(t.minute)*60+Number(t.second);
 return {day:t.year+'-'+t.month+'-'+t.day,elapsed};
}
let cachedDay='',schedule=[],playerScore=0;
function loadCup(day){
 cachedDay=day;playerScore=0;schedule=[];
 try{playerScore=Number(localStorage.getItem('moonwater-cup-'+day))||0}catch{}
 let state=Number(day.replaceAll('-',''));
 function random(){state=(Math.imul(state,1664525)+1013904223)>>>0;return state/4294967296}
 for(const name of anglers){
  const catches=[];
  for(let at=15+random()*40;at<1800;at+=45+random()*95){
   const {name:species,min:lo,max:hi}=fish[Math.floor(random()**1.7*fish.length)];
   catches.push({at:at*secondsPerDay/1800,kg:+(lo+random()*(hi-lo)).toFixed(2),species});
  }
  schedule.push({name,catches});
 }
}
const pearlKey='moonwater-pearl-days';
let pearls=[];
try{const days=JSON.parse(localStorage.getItem(pearlKey));if(Array.isArray(days))pearls=days}catch{}
let checkedFinal='';
function awardPearl(day,kg){
 if(!kg||pearls.includes(day))return;
 const rivalBest=Math.max(...schedule.flatMap(bot=>bot.catches.map(c=>c.kg)));
 if(kg<rivalBest)return;
 pearls.push(day);
 try{localStorage.setItem(pearlKey,JSON.stringify(pearls))}catch{}
}
function settleCup(t){
 const marker=t.day;
 if(checkedFinal===marker)return;
 checkedFinal=marker;
 try{
  const previous=localStorage.getItem('moonwater-last-entered');
  if(previous&&previous<t.day){
   loadCup(previous);awardPearl(previous,playerScore);loadCup(t.day);
  }
 }catch{}

}
function standings(){
 const t=eventTime();
 if(t.day!==cachedDay)loadCup(t.day);
 settleCup(t);
 el('cupPrize').textContent=pearls.includes(t.day)?'First place! Moonwater Pearl added to your basket.':'First prize · Moonwater Pearl';
 const rows=schedule.map(bot=>({name:bot.name+' · AI',kg:bot.catches.reduce((best,c)=>c.at<=t.elapsed?Math.max(best,c.kg):best,0)}));
 rows.push({name:'You',kg:playerScore});rows.sort((a,b)=>b.kg-a.kg||(a.kg&&a.name==='You'?-1:b.kg&&b.name==='You'?1:0));

 el('cupTitle').textContent='Daily Fishing Cup · Standings';
 el('ranks').innerHTML=rows.map(row=>'<li class="'+(row.name==='You'?'self':'')+'">'+row.name+' · '+(row.kg?row.kg.toFixed(2)+' kg':'No catch')+'</li>').join('');

}
standings();setInterval(standings,1000);
// ---- anglers on the shore ----
const art=id=>{try{if(parent!==window&&typeof parent.artPath==='function')return parent.artPath(id)}catch{}return 'assets/generated/'+id+'.webp'};
const ROD={reina:[.998,.002],folk:[[.934,.053],[.919,.003],[.957,.06]]},FOLK_SPOT=[[47,.95],[62,1],[76,.9]];
el('reinaAngler').src=art('comp-fish-reina');el('exitFishing').style.backgroundImage='url("'+art('ui-back')+'")';el('exitFishing').setAttribute('aria-label','Back to Mini Games');el('lake').style.backgroundImage='url("'+art('comp-fish-water')+'")';
el('folkRow').innerHTML=anglers.slice(0,3).map((n,i)=>`<div class="folk" id="folk${i}" style="left:${FOLK_SPOT[i][0]}%;height:${30*FOLK_SPOT[i][1]}%"><b>${n} <small>AI</small></b><img src="${art('comp-fish-folk-'+(i+1))}" alt=""><i></i></div>`).join('');
function drawLine(){
 const L=el('lagoon').getBoundingClientRect(),R=el('reinaAngler').getBoundingClientRect(),F=el('float').getBoundingClientRect();if(!L.width||!R.width)return;
 const svg=el('lineSvg');svg.setAttribute('viewBox','0 0 '+L.width+' '+L.height);
 const x1=R.left-L.left+R.width*ROD.reina[0],y1=R.top-L.top+R.height*ROD.reina[1],x2=F.left-L.left+F.width/2,y2=F.top-L.top+F.height*.18;
 el('linePath').setAttribute('d',`M${x1} ${y1} Q${(x1+x2)/2} ${Math.min(y1,y2)+(y2-y1)*.75} ${x2} ${y2}`);
 // each AI angler: a short line from the rod tip to a bobber in front of them
 for(let i=0;i<3;i++){const f=el('folk'+i);if(!f)continue;const img=f.querySelector('img'),dot=f.querySelector('i');if(!img.naturalWidth)continue;
  const w=img.getBoundingClientRect().width,h=img.getBoundingClientRect().height;dot.style.left=(w*ROD.folk[i][0]+12)+'px';dot.style.top=(h*1.08)+'px'}
}
el('reinaAngler').onload=drawLine;addEventListener('resize',drawLine);setInterval(drawLine,200);
// AI catches pop up over their heads when their scheduled catch time passes.
let folkSeen=null;
function folkCatches(){
 const t=eventTime();if(t.day!==cachedDay)loadCup(t.day);
 const now=schedule.slice(0,3).map(b=>b.catches.filter(c=>c.at<=t.elapsed).length);
 if(folkSeen)now.forEach((n,i)=>{if(n>folkSeen[i]){const c=schedule[i].catches[n-1],f=el('folk'+i);if(f){document.querySelectorAll('.folk em').forEach(e=>e.remove());f.insertAdjacentHTML('beforeend',`<em>${c.species} · ${c.kg.toFixed(2)} kg</em>`)}}});
 folkSeen=now;
}
folkCatches();setInterval(folkCatches,1000);


// ---- tackle shop: S.fishTackle {worms, feed} in the parent save ----
const TACKLE={worm:{name:'Bait Worms',price:200,per:1,text:'+1 cast after the 10 free ones'},feed:{name:'Fish Feed',price:300,per:3,text:'Next 3 casts: rarer, heavier fish'}};
const host=(()=>{try{return parent!==window&&typeof parent.fishSave==='function'?{get S(){return parent.fishSave()},save:()=>parent.save(),wallet:()=>parent.wallet()}:null}catch{return null}})();
function tackle(){const t=host?.S?.fishTackle;return {worms:t?.worms|0,feed:t?.feed|0}}
function setTackle(t){if(!host)return;host.S.fishTackle={worms:Math.max(0,t.worms|0),feed:Math.max(0,t.feed|0)};try{host.save()}catch{}}
let tackleNote='';
function renderTackle(){
 const t=tackle(),gold=host?.S?.gold??0,ic=n=>`style="background-image:url('${art('comp-fish-tackle')}');background-position:${n*100}% 0"`;
 el('tackle').innerHTML=['worm','feed'].map((k,n)=>{const d=TACKLE[k],have=k==='worm'?t.worms:t.feed;
  return `<div class="tk"><i ${ic(n)}></i><b>${d.name}<em>×${have}</em></b><small>${d.text}</small><button type="button" ${!host||gold<d.price?'disabled':''} onclick="buyTackle('${k}')">Buy · ${d.price} gold</button></div>`}).join('')
  +`<p class="tk-note">${tackleNote||(t.feed?'Feed in the water: next '+t.feed+' cast'+(t.feed>1?'s':'')+' get better fish.':host?'Gold: '+gold.toLocaleString():'')}</p>`;
}
function buyTackle(k){const d=TACKLE[k],t=tackle();if(!host||host.S.gold<d.price)return;host.S.gold-=d.price;if(k==='worm')t.worms+=d.per;else t.feed+=d.per;setTackle(t);try{host.wallet()}catch{}tackleNote=d.name+' bought!';renderTackle();setTimeout(()=>{tackleNote='';renderTackle()},2500)}
function best(){el('best').textContent='Personal best · '+Math.max(0,...Object.values(album.read()).map(r=>r.kg)).toFixed(2)+' kg'}
function popup(title,message,cardId){
 const fish=MoonwaterFish.byId.get(cardId),art=el('caughtArt');
 art.hidden=!fish;
 if(fish)art.src=MoonwaterFish.artUrl(fish);
 el('openCatchCard').hidden=!cardId;el('openCatchCard').onclick=()=>{dialog.close();album.open(cardId)};el('title').textContent=title;el('message').textContent=message;dialog.showModal()}
const dailyLimit=10;
const quotaKey='moonwater-daily-casts';
function usedCasts(day){
 const saved=JSON.parse(localStorage.getItem(quotaKey)||'null');
 if(day==='2026-11-13' && !saved?.afterTestRefill)return 0;
 return saved?.day===day ? saved.used : 0;
}
function refreshQuota(){
 let left=0;
 try{left=Math.max(0,dailyLimit-usedCasts(eventTime().day));el('dailyCasts').textContent='Casts left today: '+left+' / '+dailyLimit}
 catch{el('dailyCasts').textContent='Daily counter unavailable'}
 const worms=typeof tackle==='function'?tackle().worms:0;
 el('cast').disabled=phase!=='idle'||(left===0&&!worms);
 if(phase==='idle'){el('status').textContent=left?'Cast your line to start fishing.':worms?'Free casts used · each cast now takes a worm ('+worms+' left).':'Casts reset at midnight in Lisbon. Buy worms to keep fishing.';if(typeof renderTackle==='function'&&el('tackle').dataset.k!==JSON.stringify([tackle(),host?.S?.gold]))  {el('tackle').dataset.k=JSON.stringify([tackle(),host?.S?.gold]);renderTackle()}}
}
const greenArcWidth=0.20;
let castFed=false,phase='idle',pos=.5,target=.5,progress=0,time=0,last=0,seed=0;
const lakeFloat=el('float'),catchPercent=el('catchPercent');
const dial=el('dial'),band=dial.querySelector('.zone'),needle=dial.querySelector('.needle');
function renderCatch(){
 const percent=Math.floor(progress*100);
 if(lakeFloat.getAttribute('aria-valuenow')===String(percent))return;
 lakeFloat.style.setProperty('--float-fill',String(progress));
 lakeFloat.setAttribute('aria-valuenow',String(percent));
 catchPercent.textContent=percent+'%';
}
function renderDial(){
 const start=(target-greenArcWidth/2)*100;
 band.setAttribute('stroke-dasharray',`0 ${start} ${greenArcWidth*100} 100`);
 needle.setAttribute('transform','rotate('+((pos-.5)*156)+' 160 99)');
}
// The most recent finger steers. Lifting it returns control to the other held arrow.
const presses=new Map();
let steeringGoal=.5,heldDirection=0;
// Smoother pendulum (user: "the pendulum should move more smoothly"): softer easing, smaller taps, a held arrow
// speeds up gently instead of jumping to full speed, calmer drift and a slower green band.
const tapDistance=.045,holdSpeed=.38,response=6;let holdVel=0;
function steer(key,direction){
 if(phase!=='reel'||presses.has(key))return;
 if((steeringGoal-pos)*direction<0)steeringGoal=pos;
 presses.set(key,direction);heldDirection=direction;
 steeringGoal=clampNeedle(steeringGoal+tapDistance*direction);
}
function release(key){
 if(!presses.delete(key))return;
 const remaining=Array.from(presses.values()).pop()||0;
 if(remaining && remaining!==heldDirection)steeringGoal=pos;
 heldDirection=remaining;
}
function stopArrow(){presses.clear();heldDirection=0;steeringGoal=pos}
function clampNeedle(value){return Math.max(.02,Math.min(.98,value))}
for(const type of ['selectstart','dragstart','contextmenu']){
 document.addEventListener(type,event=>event.preventDefault(),true);
}
// Some iPad browsers start a native selection when the second contact lands.
document.addEventListener('touchstart',event=>{
 if(event.touches.length>1 && event.cancelable)event.preventDefault();
},{capture:true,passive:false});

function controls(){
 document.body.dataset.phase=phase;
 el('cast').disabled=phase!=='idle';
 const showingCatch=phase==='reel'||phase==='landed';
 lakeFloat.setAttribute('aria-hidden',String(!showingCatch));
 el('cast').hidden=showingCatch;
 el('left').hidden=el('right').hidden=!showingCatch;
 el('left').disabled=el('right').disabled=phase!=='reel';
 el('basket').disabled=phase!=='idle';
 refreshQuota();
}
window.addEventListener('blur',stopArrow);
document.addEventListener('visibilitychange',()=>{if(document.hidden)stopArrow()});
function finish(won){
 phase=won?'landed':'idle';stopArrow();controls();el('castLabel').textContent='Cast again';
 if(!won){popup('The fish slipped away','Cast again and keep the marker inside the green band.');return}
 const {id,name,min:low,max:high,bonus}=fish[Math.floor(Math.random()**(castFed?1:1.7)*fish.length)];
 const kg=+(low+(high-low)*(castFed?.35+.65*Math.random():Math.random())).toFixed(2),old=album.catch(id,kg);
 const t=eventTime();
 {
  settleCup(t);
  if(cachedDay!==t.day)loadCup(t.day);
  playerScore=Math.max(playerScore,kg);
  try{localStorage.setItem('moonwater-last-entered',t.day);localStorage.setItem('moonwater-cup-'+t.day,String(playerScore))}catch{}
  standings();
 }
 best();
 el('status').textContent='Fish caught!';
 setTimeout(()=>{
  const copy=old.count===0?'New card!':'Card × '+(old.count+1);
  const weight=kg>old.kg?'New personal record!':'Best '+old.kg.toFixed(2)+' kg';
  popup(name,kg.toFixed(2)+' kg · '+weight+' · '+copy+' · +'+bonus.amount+' '+bonus.label,id);
 },1100);
}
function tick(now){
 if(document.hidden){last=now;requestAnimationFrame(tick);return}
 const dt=Math.min(.06,(now-last)/1000);last=now;time+=dt;
 if(phase==='wait'&&time>1.4){phase='reel';time=0;controls();el('status').textContent='Use the arrows to keep the needle in green.';el('castLabel').textContent='Reeling'}
 if(phase==='reel'){
 target=.5+.22*Math.sin(time*.8);
 const drift=.08*Math.sin(time*1.1+seed);holdVel+=(heldDirection*holdSpeed-holdVel)*(-Math.expm1(-5*dt));
 steeringGoal=clampNeedle(steeringGoal+(drift+holdVel)*dt);
 pos+=(steeringGoal-pos)*(-Math.expm1(-response*dt));
 const inGreen=Math.abs(target-pos)<=greenArcWidth/2;
 progress=Math.max(0,Math.min(1,progress+(inGreen ? .24 : -.11)*dt));
 renderDial();renderCatch();
 if(progress>=1||time>=15){finish(progress>=1);return}
 }
 requestAnimationFrame(tick)
}
function startCast(){
 if(phase!=='idle')return;
 const t=eventTime();
 try{
  const used=usedCasts(t.day);
  if(used>=dailyLimit){const tk=tackle();if(!tk.worms){refreshQuota();return}tk.worms--;setTackle(tk)}
  else
  localStorage.setItem(quotaKey,JSON.stringify({day:t.day,used:used+1,afterTestRefill:t.day==='2026-11-13'}));
  {const tk=tackle();castFed=tk.feed>0;if(castFed){tk.feed--;setTackle(tk)}}
 }catch{refreshQuota();return}
 phase='wait';time=progress=0;holdVel=0;pos=target=steeringGoal=.5;seed=Math.random()*6;renderDial();last=performance.now();renderCatch();el('status').textContent='Watching the float…';el('castLabel').textContent='Line cast';controls();requestAnimationFrame(tick)};
el('cast').onclick=()=>navigator.locks ? navigator.locks.request(quotaKey,startCast) : startCast();
window.addEventListener('storage',refreshQuota);
setInterval(refreshQuota,1000);
for(const [id,direction] of [['left',-1],['right',1]]){
 const button=el(id);
 button.onpointerdown=event=>{
  if(phase!=='reel'||event.button!==0)return;
  event.preventDefault();
  button.setPointerCapture(event.pointerId);
  steer(event.pointerId,direction);
 };
 button.onpointerup=button.onpointercancel=button.onlostpointercapture=event=>release(event.pointerId);
 button.onclick=event=>{
  if(event.detail===0){steer('activate',direction);release('activate')}
 };
}
const keyDirections={ArrowLeft:-1,ArrowRight:1};
window.addEventListener('keydown',event=>{
 if(phase!=='reel'||!Object.hasOwn(keyDirections,event.key))return;
 event.preventDefault();steer(event.key,keyDirections[event.key]);
});
window.addEventListener('keyup',event=>release(event.key));
el('basket').onclick=()=>{
 const records=album.read();
 const total=Object.values(records).reduce((count,r)=>count+r.count,0);
 popup('Fish basket',total+' caught · Moonwater Pearls: '+pearls.length+'. See every species in Cards.');
};
dialog.addEventListener('close',()=>{
 if(phase==='landed'){phase='idle';controls()}
 if(phase==='idle'){progress=0;pos=target=steeringGoal=.5;renderCatch();renderDial()}
});
el('close').onclick=()=>dialog.close();best();controls();renderDial();
</script></html>
